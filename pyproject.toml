[project]
name = "conjectures-miner"
version = "0.1.0"
description = "Miner CLI for the conjectures.io Subnet 66 Lean-proof validator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bittensor>=11.0.2",
    "httpx>=0.28.1",
    "platformdirs>=4.11.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=13.8.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.1",
]

[project.scripts]
conjectures = "conjectures_miner.cli:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conjectures_miner"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "C4", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Typer reads options off the signature, so a parameter the body never touches is the interface.
"src/conjectures_miner/commands/*.py" = ["ARG001"]
"src/conjectures_miner/cli.py" = ["ARG001"]
# pydantic-settings dictates the source-hook signature.
"src/conjectures_miner/settings.py" = ["ARG003"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
